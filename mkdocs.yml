site_name: Introduction to Quantum Computing
site_description: 'An introductory course on quantum computing covering qubits, gates, algorithms, error correction, and hardware platforms. All content licensed Creative Commons ShareAlike Attribution Noncommercial.'
site_author: 'Sharat B'
repo_name: 'GitHub Repo'
site_url: 'https://AK95AM98.github.io/quantum_computing/'
repo_url: 'https://github.com/AK95AM98/quantum_computing'
edit_uri: 'blob/main/docs'

nav:
  - Home: index.md
  - Chapters:
    - chapters/index.md
    - Introduction: chapters/chapter1.md
    - Basis of Quantum: chapters/chapter2.md
    - Teleportation: chapters/chapter3.md
    - New Quantum: chapters/chapter4.md
    - Algorithms: chapters/chapter5.md
    - D-Wave: chapters/chapter6.md
    - Ion-Q: chapters/chapter7.md
    - Ion-Q (contd): chapters/chapter8.md
    - Unitary Matrices Tutorial: chapters/chapter10.md
    - LaTeX: chapters/chapter11.md
    - IBM Quantum Roadmap: chapters/chapter19.md
    - Try1: chapters/chapter21.md
  - Prompts:
    - Introduction: prompts/index.md
    - Course Description: prompts/01-course-description.md
    - Enumeration: prompts/02-enumeration.md
  - Learning Graph:
    - Concept List: learning-graph/concept-list.md
    - Course Description Assessment: learning-graph/course-description-assessment.md
  - MicroSims:
    - Graph Viewer: sims/graph-viewer/index.md
  - Course Description: course-description.md

# Dan's MicroSite Standards from here down

theme:
  name: material
  logo: img/logo.png
  favicon: img/favicon.ico
  primary: custom
  accent: 'gold'
  include_sidebar: true
  features:
    - content.code.copy
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - toc.follow
    - navigation.top
    # this adds the prev and next icons in the footer
    - navigation.footer
    - content.action.edit
plugins:
  - search
#  - social
markdown_extensions:
  - admonition
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - pymdownx.highlight:
      linenums: true
  - pymdownx.arithmatex:
      generic: true
extra_css:
   - css/extra.css
extra_javascript:
    - js/extra.js
    - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

